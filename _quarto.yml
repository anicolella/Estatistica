project:
  type: book
  output-dir: docs

lang: pt-BR

book:
  title: "Inferência Estatística Aplicada à Economia"
  subtitle: "Notas de Aula"
  favicon: figuras/marca/monograma-positivo.svg
  navbar:
    background: "#071739"
    logo: figuras/usp.png
    search: true
    left:
      - text: "Home"
        file: index.qmd
      #- intro.qmd
      #- summary.qmd
      #- pesquisa.qmd
      #- interpretando.qmd
    right:
      - text: '<img class="navbar-marca-autoral" src="data:image/svg+xml;base64," alt="Alexandre Nicolella">'
        file: cap/cap1_autores.qmd
      - icon: github
        href: https://github.com/anicolella
        aria-label: GitHub
  sidebar:
    background: "#F7F6F3"
    search: true
    style: "docked"
    collapse-level: 1
  page-navigation: true
  page-footer:
    center: '<span class="credito-autoral"><img src="data:image/svg+xml;base64," alt=""> <span>Criação e Design: <strong>Alexandre Nicolella</strong> — FEA-RP/USP</span></span>'
  author:
  - name: "Alexandre Nicolella"
    affiliation: "Universidade de São Paulo (USP)"
  date: "03/13/2026"
  chapters:
    - index.qmd
    - cap/cap1_autores.qmd
    - cap/cap2_summary.qmd

    - part: "Manipulando os Dados"
      chapters:
        - cap/cap3_int_R.qmd
        - cap/cap3_1_dplyr.qmd
        - cap/cap4_googledrive.qmd

    - part: "Motivando e Relembrando"
      chapters:
        - cap/cap5_estatistica.qmd
        - cap/cap6_va_bidimensional.qmd
        - cap/cap7_dist_normal.qmd

    - part: "Inferência Estatística"
      chapters:
        - cap/cap8_inferencia.qmd
        - cap/cap9_convergencia.qmd
        - cap/cap10_amostragem.qmd

    - part: "Estimação"
      chapters:
        - cap/cap11_estimacao_ponto.qmd
        - cap/cap12_estimacao_intervalo.qmd

    - part: "Teste de Hipótese"
      chapters:
        - cap/cap13_teste_hip.qmd
        - cap/cap14_hip_pop.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - tema-estatistica.scss
    css: estilos.css
    include-after-body: tema-componentes.html
    toc: true
    toc-title: "Neste capítulo"
    toc-depth: 3
    code-copy: true
    smooth-scroll: true
    fontsize: 16px
    #linestretch: 1.7
  #pdf:
    #documentclass: scrreprt


editor: visual

