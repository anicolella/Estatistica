<script>
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".callout").forEach((box) => {
    const title = box.querySelector(".callout-title-container, .callout-title")
      ?.textContent.trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase() || "";
    if (title.includes("DEFINICAO")) box.classList.add("caixa-definicao");
    else if (title.includes("TEOREMA")) box.classList.add("caixa-teorema");
    else if (title.includes("EXEMPLO")) box.classList.add("caixa-exemplo");
    else if (title.includes("RESPOSTA")) box.classList.add("caixa-resposta");
  });
});
</script>
